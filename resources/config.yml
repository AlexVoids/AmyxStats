# Время между сохранениями на диск. При штатном выключении всё сохраняется сразу.
save-interval-seconds: 10
# Обновление уже используемых плейсхолдеров ScoreHud.
scorehud-update-seconds: 2
# По умолчанию команда игрока открывает меню; false — вывод в чат.
forms: true
prefix: "&b&lСтатистика &8» &r"
track-creative: false
track-spectator: false
# Не учитывать игровые действия в этих мирах. Время онлайн и дни считаются везде.
excluded-worlds: []
# Большие скачки координат не считаются обычной ходьбой.
maximum-move-distance: 16
# Количество позиций в топе (1–50).
top-size: 10
